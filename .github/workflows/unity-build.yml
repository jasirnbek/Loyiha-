name: Unity Build Pipeline 🚀

on:
  push:
    branches:
      - main  # Kod main branchiga push qilinganda ishlaydi

jobs:
  buildAllPlatforms:
    name: Build for WebGL & Android 🛠️
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub-dagi kodni yuklab olish
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Unity keshini tekshirish (Tezroq build bo'lishi uchun)
      - name: Cache Library folder
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-Unity-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Unity-

      # 3. WebGL Build qilish
      - name: Build WebGL Platform 🌐
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: UnityBuilder.BuildProject

      # 4. WebGL natijasini saqlash (Artifact)
      - name: Upload WebGL Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-WebGL
          path: build/WebGL

      # 5. Android Build qilish
      - name: Build Android Platform 📱
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: UnityBuilder.BuildProject

      # 6. Android (.apk) natijasini saqlash
      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android
          path: build/Android
